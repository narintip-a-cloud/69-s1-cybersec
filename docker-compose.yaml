services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_PASSWORD: "narintip12345"
      POSTGRES_USER: "narintip"
      POSTGRES_DB: "narintip"
    volumes:
      - ./data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: 69-s1-admin
    environment:
      PGADMIN_DEFAULT_EMAIL: "narintip-a@rmutp.ac.th"
      PGADMIN_DEFAULT_PASSWORD: "narintip12345"
    ports:
      - "8081:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      
 app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - "9091:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: 69-s1-db
      DATABASE_PORT: 5432
      DATABASE_NAME: narintip
      DATABASE_USERNAME: narintip
      DATABASE_PASSWORD: narintip12345

volumes:
  data-pgadmin:
